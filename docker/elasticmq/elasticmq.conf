# ElasticMQ: SQS-compatible queue for local runs (in-memory, empty on every start).
include classpath("application.conf")

node-address {
  protocol = http
  host = sqs
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  article-events {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "article-events-dlq"
      maxReceiveCount = 5
    }
  }
  article-events-dlq {}
}
