# SQS client settings shared by the editor and the invalidator (dummy credentials for ElasticMQ).
x-sqs-env: &sqs-env
  SQS_ENDPOINT: http://sqs:9324
  QUEUE_URL: http://sqs:9324/000000000000/article-events
  AWS_REGION: eu-west-3
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local

services:
  app:
    build: .
    environment:
      # Plain HTTP on port 80 inside the container (no automatic HTTPS)
      SERVER_NAME: ":80"
      # "full" (strategy A), "tags" (strategy B) or "ttl" (no purge, SHORT_TTL seconds); see make strategy-*
      INVALIDATION_STRATEGY: ${INVALIDATION_STRATEGY:-full}
      SHORT_TTL: ${SHORT_TTL:-60}
    volumes:
      - ./:/app
      # SQLite on a named volume, shared with the editor (bind mounts are unsafe for SQLite locks across containers).
      - data:/app/var/data
    ports:
      - "8002:80"   # direct access to Symfony, bypassing the cache

  varnish:
    image: varnish:7.7
    depends_on:
      - app
    environment:
      VARNISH_SIZE: 256M
    volumes:
      - ./docker/varnish/default.vcl:/etc/varnish/default.vcl:ro
    ports:
      - "8082:80"   # the site as readers see it, through Varnish

  # NestJS editor: updates and publishes articles in the shared database, then queues an article event.
  editor:
    build: ./editor
    depends_on:
      - sqs
    environment:
      PORT: 3000
      DATABASE_PATH: /data/data.db
      <<: *sqs-env
    volumes:
      - data:/data
    ports:
      - "3002:3000"

  # SQS-compatible queue (ElasticMQ); real SQS only needs another SQS_ENDPOINT/QUEUE_URL and credentials.
  sqs:
    image: softwaremill/elasticmq-native:1.6.14
    volumes:
      - ./docker/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      - "9334:9324"   # SQS API
      - "9335:9325"   # ElasticMQ UI

  # Consumes article events and invalidates Varnish with the active strategy (worker adapter; the Lambda adapter runs the same core).
  invalidator:
    build: ./invalidator
    depends_on:
      - sqs
      - varnish
    environment:
      VARNISH_URL: http://varnish
      INVALIDATION_STRATEGY: ${INVALIDATION_STRATEGY:-full}
      <<: *sqs-env

  # Load generator, only started by the benchmark (make bench).
  k6:
    image: grafana/k6:1.0.0
    profiles: ["bench"]
    depends_on:
      - varnish
    volumes:
      - ./bench:/bench
    working_dir: /bench

volumes:
  data:
